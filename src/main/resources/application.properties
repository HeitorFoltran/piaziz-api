spring.application.name=azizaid-hub-api

server.port=${PORT:8081}
server.forward-headers-strategy=native

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=none
spring.sql.init.mode=never

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=America/Sao_Paulo

frontend.base-url=${FRONTEND_BASE_URL:http://localhost:5173}

rate-limit.login.capacidade=20
rate-limit.login.janela-minutos=15
rate-limit.ficha-publica-status.capacidade=30
rate-limit.ficha-publica-status.janela-minutos=10
rate-limit.ficha-publica-envio.capacidade=10
rate-limit.ficha-publica-envio.janela-minutos=60
rate-limit.login-por-email.max-falhas=10
rate-limit.login-por-email.janela-minutos=15
