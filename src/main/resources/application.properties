spring.application.name=azizaid-hub-api

server.port=${PORT:8081}
server.forward-headers-strategy=native

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=none
spring.sql.init.mode=never

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=America/Sao_Paulo

# requestId vem do RequestIdFilter (MDC). Em produção o log é JSON (LOGGING_STRUCTURED_FORMAT_CONSOLE=ecs
# em deploy/docker-compose.prod.yml), e o MDC entra no JSON sozinho.
logging.pattern.level=%5p [%X{requestId:-}]

frontend.base-url=${FRONTEND_BASE_URL:http://localhost:5173}

# Origens separadas por vírgula. O default cobre só o dev local; homologação e produção passam CORS_ALLOWED_ORIGINS.
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:8080,http://localhost:3000}

rate-limit.login.capacidade=20
rate-limit.login.janela-minutos=15
rate-limit.ficha-publica-status.capacidade=30
rate-limit.ficha-publica-status.janela-minutos=10
rate-limit.ficha-publica-envio.capacidade=10
rate-limit.ficha-publica-envio.janela-minutos=60
rate-limit.troca-senha.capacidade=10
rate-limit.troca-senha.janela-minutos=15
rate-limit.login-por-email.max-falhas=10
rate-limit.login-por-email.janela-minutos=15

# Retenção (LGPD), rotina diária em RetencaoAgendador:
# - ficha_pendente: revisadas são apagadas N dias após data_revisao; PENDENTE nunca. Se os prazos
#   mudarem, mudar também o aviso em FichasPendentes.tsx no frontend.
# - leitura_audit_log: linhas apagadas após N dias.
# - ip: IP apagado (a linha fica) em ficha_publica_audit_log, auth_audit_log e ficha_pendente.
retencao.cron=0 0 3 * * *
retencao.ficha-pendente.aprovada-dias=30
retencao.ficha-pendente.rejeitada-dias=90
retencao.leitura-audit.dias=365
retencao.ip.dias=90
