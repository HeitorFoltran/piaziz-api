spring.application.name=azizaid-hub-api-test

JWT_SECRET=chave-de-teste-nao-usar-em-producao-1234567890abcdef
frontend.base-url=http://localhost:5173
cors.allowed-origins=http://localhost:5173

spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.sql.init.mode=never

# Suítes de sistema compartilham contexto/IP (127.0.0.1); limites altos evitam 429 cruzado entre
# testes. RateLimitFilterSystemTest sobrescreve com @SpringBootTest(properties=...) quando precisa
# de um limite baixo de verdade. Este arquivo substitui inteiramente o application.properties de
# main no classpath de teste, então todas as chaves de rate-limit.* precisam estar aqui, não só as
# que o teste quer mudar — uma janela-minutos ausente vira 0 e quebra Refill.greedy (período > 0).
rate-limit.login.capacidade=10000
rate-limit.login.janela-minutos=15
rate-limit.ficha-publica-status.capacidade=10000
rate-limit.ficha-publica-status.janela-minutos=10
rate-limit.ficha-publica-envio.capacidade=10000
rate-limit.ficha-publica-envio.janela-minutos=60
rate-limit.troca-senha.capacidade=10000
rate-limit.troca-senha.janela-minutos=15
rate-limit.login-por-email.max-falhas=10000
rate-limit.login-por-email.janela-minutos=15

# "-" desliga o @Scheduled; os testes chamam RetencaoFichaPendenteService.aplicarRetencao() direto.
retencao.ficha-pendente.aprovada-dias=30
retencao.ficha-pendente.rejeitada-dias=90
retencao.ficha-pendente.cron=-
